<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SYNCly — Study Together, In Sync</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg0:#0B0B0F; --bg1:#16161A; --border:#252529;
    --text:#EFEFEF; --muted:#8A8A8E; --accent:#C4633F; --accent-dim:#7a4130;
    --ok:#3DA66F;
    padding-top: env(safe-area-inset-top,0px);
    padding-bottom: env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;background:var(--bg0);}
  body{
    display:flex; align-items:center; justify-content:center;
    font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
    overflow:hidden;
  }
  .stage{
    position:relative; width:100%; max-width:1600px; aspect-ratio:16/9;
    background:
      radial-gradient(ellipse 60% 55% at 50% 46%, rgba(196,99,63,0.10), transparent 70%),
      linear-gradient(180deg,#0D0D11 0%, #0B0B0F 60%, #0A0A0D 100%);
  }
  svg{position:absolute; inset:0; width:100%; height:100%; display:block;}
  .mono{font-family:'JetBrains Mono',monospace;}

  /* ---- ambient ---- */
  .glow{ animation: breathe 9s ease-in-out infinite; transform-origin:800px 430px; }
  @keyframes breathe{
    0%,100%{ opacity:.55; transform:scale(1); }
    50%{ opacity:.9; transform:scale(1.05); }
  }
  .particle{ animation: drift 14s ease-in-out infinite; }
  .particle.p2{ animation-duration:17s; animation-delay:-4s; }
  .particle.p3{ animation-duration:12s; animation-delay:-8s; }
  .particle.p4{ animation-duration:19s; animation-delay:-2s; }
  @keyframes drift{
    0%{ transform:translateY(0px); opacity:.15; }
    50%{ transform:translateY(-18px); opacity:.5; }
    100%{ transform:translateY(0px); opacity:.15; }
  }

  /* ---- figures: subtle breathing ---- */
  .figure{ animation: breathe-fig 6s ease-in-out infinite; transform-origin:center bottom; }
  .figure.f2{ animation-duration:6.6s; animation-delay:-1.2s; }
  .figure.f3{ animation-duration:5.6s; animation-delay:-2.4s; }
  @keyframes breathe-fig{
    0%,100%{ transform:translateY(0); }
    50%{ transform:translateY(-2.5px); }
  }
  .head-tilt{ animation: tilt 8s ease-in-out infinite; transform-origin:center; }
  .head-tilt.t2{ animation-delay:-3s; animation-duration:9s;}
  @keyframes tilt{
    0%,100%{ transform:rotate(0deg); }
    50%{ transform:rotate(1.4deg); }
  }

  /* ---- cursor blink ---- */
  .cursor{ animation: blink 1.1s step-end infinite; }
  @keyframes blink{ 50%{ opacity:0; } }

  /* ---- code lines subtle shimmer as if typing ---- */
  .codeline{ animation: typeglow 5s ease-in-out infinite; }
  .codeline.c2{ animation-delay:-1.1s; }
  .codeline.c3{ animation-delay:-2.3s; }
  .codeline.c4{ animation-delay:-3.4s; }
  @keyframes typeglow{
    0%,80%,100%{ opacity:.85; }
    88%{ opacity:.35; }
  }

  /* ---- progress bars ---- */
  .prog-fill{ animation: fillbar 7s ease-in-out infinite; transform-origin:left center; }
  @keyframes fillbar{
    0%{ transform:scaleX(.55); }
    45%{ transform:scaleX(.82); }
    55%{ transform:scaleX(.82); }
    100%{ transform:scaleX(.55); }
  }
  .prog-fill.pf2{ animation-duration:8.5s; animation-delay:-2s;}

  /* ---- quiz check pulse ---- */
  .check-pop{ animation: pop 5.5s ease-in-out infinite; transform-origin:center; }
  @keyframes pop{
    0%,60%{ transform:scale(0); opacity:0; }
    70%{ transform:scale(1.15); opacity:1; }
    80%,100%{ transform:scale(1); opacity:1; }
  }
  .quiz-opt{ animation: optglow 5.5s ease-in-out infinite; }
  @keyframes optglow{
    0%,58%{ opacity:.35; }
    70%,90%{ opacity:1; }
    100%{ opacity:.35; }
  }

  /* ---- timer pulse ---- */
  .timer-dot{ animation: timerpulse 2.4s ease-in-out infinite; transform-origin:center; }
  @keyframes timerpulse{
    0%,100%{ opacity:.5; transform:scale(1); }
    50%{ opacity:1; transform:scale(1.25); }
  }

  /* ---- floating note (explanation diagram) ---- */
  .float-note{ animation: floatnote 6.5s ease-in-out infinite; transform-origin:center; }
  @keyframes floatnote{
    0%,100%{ transform:translateY(0) rotate(-1.5deg); }
    50%{ transform:translateY(-7px) rotate(1deg); }
  }
  .note-line{ animation: drawline 5s ease-in-out infinite; }
  @keyframes drawline{
    0%,100%{ stroke-dashoffset:40; opacity:.5;}
    50%{ stroke-dashoffset:0; opacity:1;}
  }

  /* ---- connecting sync lines between workspaces ---- */
  .sync-line{ stroke-dasharray:6 7; animation: flow 3.2s linear infinite; }
  .sync-line.s2{ animation-duration:3.8s; animation-direction:reverse; }
  @keyframes flow{ to{ stroke-dashoffset:-260; } }
  .sync-node{ animation: nodepulse 3.2s ease-in-out infinite; transform-origin:center; }
  @keyframes nodepulse{
    0%,100%{ opacity:.5; transform:scale(1);} 50%{ opacity:1; transform:scale(1.4);}
  }

  /* ---- status dot ---- */
  .status-dot{ animation: statuspulse 2.8s ease-in-out infinite; transform-origin:center; }
  @keyframes statuspulse{
    0%,100%{ opacity:.6; } 50%{ opacity:1; }
  }
</style>
</head>
<body>
<div class="stage">
<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="ambient" cx="50%" cy="46%" r="55%">
      <stop offset="0%" stop-color="#C4633F" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#C4633F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="panelFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#18181D"/>
      <stop offset="100%" stop-color="#131316"/>
    </linearGradient>
    <linearGradient id="deskFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1B1B20"/>
      <stop offset="100%" stop-color="#131316"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="soft2" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- scene wrapper: recomposed to remove excess top/bottom margin -->
  <g transform="translate(-118.5,-92.7) scale(1.15)">

  <!-- ambient glow, centered on the whiteboard hub -->
  <ellipse class="glow" cx="790" cy="400" rx="430" ry="230" fill="url(#ambient)" filter="url(#soft)"/>

  <!-- subtle hub halo behind the whiteboard diagram, marking it as the sync point -->
  <circle cx="785" cy="298" r="150" fill="none" stroke="#C4633F" stroke-opacity="0.10" stroke-width="60" filter="url(#soft2)"/>

  <!-- ===================== SYNC CONNECTOR LINES — coding & quiz workspaces into the shared whiteboard ===================== -->
  <g stroke="#C4633F" stroke-opacity="0.4" stroke-width="1.5" fill="none">
    <path class="sync-line" d="M 530 355 C 610 320, 650 310, 693 300"/>
    <path class="sync-line s2" d="M 1070 355 C 990 320, 930 315, 877 309"/>
  </g>

  <!-- ============================================================= -->
  <!-- LEFT WORKSPACE — coding / problem solving -->
  <!-- ============================================================= -->
  <g transform="translate(150,230)">
    <!-- desk -->
    <rect x="0" y="430" width="400" height="18" rx="4" fill="url(#deskFill)" stroke="#252529"/>
    <!-- screen panel -->
    <rect x="20" y="0" width="360" height="260" rx="14" fill="url(#panelFill)" stroke="#252529" stroke-width="1.5"/>
    <!-- screen header -->
    <circle cx="44" cy="26" r="4" fill="#3DA66F" class="status-dot"/>
    <text x="58" y="30" fill="#8A8A8E" font-size="12" class="mono">problem_set.py</text>
    <line x1="20" y1="44" x2="380" y2="44" stroke="#252529"/>
    <!-- code lines -->
    <g class="mono" font-size="12">
      <text class="codeline c1" x="40" y="72" fill="#8A8A8E">def <tspan fill="#EFEFEF">merge_intervals</tspan>(arr):</text>
      <text class="codeline c2" x="56" y="94" fill="#8A8A8E">arr.sort()</text>
      <text class="codeline c3" x="56" y="116" fill="#8A8A8E">res = []</text>
      <text class="codeline c4" x="56" y="138" fill="#C4633F">for start, end in arr:</text>
      <text class="codeline c2" x="72" y="160" fill="#8A8A8E">if res and start &lt;= res[-1][1]:</text>
      <rect x="36" y="166" width="8" height="14" fill="#EFEFEF" class="cursor"/>
    </g>
    <!-- progress footer -->
    <rect x="20" y="210" width="360" height="34" rx="8" fill="#131316" stroke="#252529"/>
    <text x="36" y="231" fill="#8A8A8E" font-size="11" class="mono">Tests passed</text>
    <rect x="140" y="221" width="200" height="6" rx="3" fill="#252529"/>
    <rect x="140" y="221" width="200" height="6" rx="3" fill="#3DA66F" class="prog-fill"/>

    <!-- floating small timer chip near panel -->
    <g transform="translate(342,-20)">
      <rect x="0" y="0" width="70" height="28" rx="14" fill="#16161A" stroke="#252529"/>
      <circle class="timer-dot" cx="18" cy="14" r="3.5" fill="#C4633F"/>
      <text x="30" y="18" fill="#8A8A8E" font-size="11" class="mono">08:42</text>
    </g>

    <!-- figure sitting at desk (abstract, from behind/side) — leaning slightly forward into the problem -->
    <g class="figure" transform="translate(200,300) rotate(2)">
      <ellipse cx="0" cy="150" rx="86" ry="14" fill="#000" opacity="0.28" filter="url(#soft2)"/>
      <!-- torso, slight forward lean -->
      <path d="M -70 150 C -75 72, -52 22, -4 16 C 48 18, 74 70, 70 150 Z" fill="#1D1D22" stroke="#2B2B31" stroke-width="1.5"/>
      <!-- crew placket accent -->
      <path d="M -14 20 L -14 40 M 14 20 L 14 40" fill="none" stroke="#C4633F" stroke-width="2.5" stroke-linecap="round" opacity="0.85"/>
      <!-- neck + head -->
      <g class="head-tilt">
        <rect x="-11" y="-8" width="22" height="20" rx="8" fill="#2A2A30"/>
        <circle cx="0" cy="-30" r="30" fill="#242429" stroke="#2E2E34" stroke-width="1.5"/>
        <!-- short, side-swept hair -->
        <path d="M -30 -32 C -34 -54, -14 -63, 2 -62 C 17 -61, 31 -50, 28 -30 C 24 -46, 4 -48, -8 -46 C -20 -44, -27 -40, -30 -32 Z" fill="#191A1D"/>
      </g>
      <!-- arm toward keyboard -->
      <path d="M -55 90 C -20 108, 10 112, 40 100" fill="none" stroke="#242429" stroke-width="20" stroke-linecap="round"/>
    </g>
  </g>

  <!-- ============================================================= -->
  <!-- CENTER WORKSPACE — explaining a concept (focal point, slightly larger) -->
  <!-- ============================================================= -->
  <g transform="translate(605,168)">
    <rect x="0" y="470" width="390" height="18" rx="4" fill="url(#deskFill)" stroke="#252529"/>
    <rect x="18" y="0" width="354" height="290" rx="16" fill="url(#panelFill)" stroke="#2B2B31" stroke-width="1.5"/>
    <circle cx="42" cy="28" r="4" fill="#3DA66F" class="status-dot"/>
    <text x="56" y="32" fill="#8A8A8E" font-size="12" class="mono">shared_whiteboard</text>
    <line x1="18" y1="46" x2="372" y2="46" stroke="#252529"/>

    <!-- simple diagram: nodes + connecting lines representing concept explanation -->
    <g stroke="#3A3A41" stroke-width="1.5" fill="none">
      <path d="M 90 130 L 180 90 L 270 140 L 200 200 Z"/>
      <path d="M 180 90 L 180 230"/>
    </g>
    <circle class="sync-node" cx="90" cy="130" r="6" fill="#16161A" stroke="#C4633F" stroke-width="2"/>
    <circle cx="180" cy="90" r="6" fill="#16161A" stroke="#EFEFEF" stroke-width="2"/>
    <circle class="sync-node" cx="270" cy="140" r="6" fill="#16161A" stroke="#EFEFEF" stroke-width="2"/>
    <circle cx="200" cy="200" r="6" fill="#16161A" stroke="#3DA66F" stroke-width="2"/>
    <text x="128" y="252" fill="#8A8A8E" font-size="11" class="mono">Big-O: O(n log n)</text>

    <!-- floating annotation note -->
    <g class="float-note" transform="translate(255,-26)">
      <rect x="0" y="0" width="118" height="70" rx="10" fill="#16161A" stroke="#C4633F" stroke-opacity="0.5" stroke-width="1.5"/>
      <line class="note-line" x1="14" y1="18" x2="100" y2="18" stroke="#8A8A8E" stroke-width="2" stroke-linecap="round" stroke-dasharray="86" stroke-dashoffset="0"/>
      <line class="note-line" x1="14" y1="34" x2="80" y2="34" stroke="#8A8A8E" stroke-width="2" stroke-linecap="round" stroke-dasharray="66" stroke-dashoffset="0"/>
      <line class="note-line" x1="14" y1="50" x2="90" y2="50" stroke="#C4633F" stroke-width="2" stroke-linecap="round" stroke-dasharray="76" stroke-dashoffset="0"/>
    </g>

    <!-- two figures at center: explaining + listening -->
    <g class="figure" transform="translate(130,340) rotate(-1.5)">
      <ellipse cx="0" cy="150" rx="80" ry="13" fill="#000" opacity="0.28" filter="url(#soft2)"/>
      <!-- upright torso, engaged posture -->
      <path d="M -64 150 C -68 64, -44 16, 2 14 C 48 17, 68 66, 64 150 Z" fill="#1F1F25" stroke="#2C2C33" stroke-width="1.5"/>
      <!-- round-neck accent -->
      <path d="M -16 22 C -7 31, 7 31, 16 22" fill="none" stroke="#8A8A8E" stroke-width="3" stroke-linecap="round"/>
      <g class="head-tilt t2">
        <rect x="-10" y="-6" width="20" height="18" rx="7" fill="#2A2A30"/>
        <circle cx="0" cy="-27" r="28" fill="#26262C" stroke="#302F36" stroke-width="1.5"/>
        <!-- cropped, close-textured hair -->
        <path d="M -27 -28 C -29 -46, -14 -54, 0 -54 C 14 -54, 28 -47, 26 -29 C 22 -38, 12 -41, 0 -41 C -12 -41, -22 -38, -27 -28 Z" fill="#17181B"/>
        <path d="M -20 -40 L -20 -34 M -9 -43 L -9 -37 M 3 -43 L 3 -37 M 15 -40 L 15 -34" stroke="#242429" stroke-width="1.4" stroke-linecap="round"/>
      </g>
      <!-- arm gesturing toward diagram -->
      <path d="M 40 92 C 70 78, 96 60, 118 30" fill="none" stroke="#242429" stroke-width="18" stroke-linecap="round"/>
    </g>

    <g class="figure f2" transform="translate(300,352) rotate(-3)">
      <ellipse cx="0" cy="140" rx="72" ry="12" fill="#000" opacity="0.26" filter="url(#soft2)"/>
      <!-- slightly reclined, relaxed listening posture -->
      <path d="M -58 140 C -63 60, -40 16, 4 15 C 44 19, 62 62, 58 140 Z" fill="#1D1D22" stroke="#2B2B31" stroke-width="1.5"/>
      <!-- v-neck accent -->
      <path d="M -14 20 L 0 34 L 14 20" fill="none" stroke="#C4633F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <g class="head-tilt">
        <rect x="-9" y="-6" width="18" height="16" rx="6" fill="#28282E"/>
        <circle cx="0" cy="-25" r="26" fill="#242429" stroke="#2E2E34" stroke-width="1.5"/>
        <!-- longer hair, gathered back -->
        <path d="M -25 -28 C -27 -48, -8 -54, 3 -53 C 16 -52, 26 -43, 24 -26 C 20 -38, -18 -40, -25 -28 Z" fill="#17181B"/>
        <path d="M 20 -22 C 30 -16, 32 -2, 24 8 C 20 -2, 18 -14, 20 -22 Z" fill="#17181B"/>
      </g>
    </g>
  </g>

  <!-- ============================================================= -->
  <!-- RIGHT WORKSPACE — quiz / comparing answers -->
  <!-- ============================================================= -->
  <g transform="translate(1050,230)">
    <rect x="0" y="430" width="400" height="18" rx="4" fill="url(#deskFill)" stroke="#252529"/>
    <rect x="20" y="0" width="360" height="260" rx="14" fill="url(#panelFill)" stroke="#252529" stroke-width="1.5"/>
    <circle cx="44" cy="26" r="4" fill="#3DA66F" class="status-dot"/>
    <text x="58" y="30" fill="#8A8A8E" font-size="12" class="mono">quiz · round 3</text>
    <line x1="20" y1="44" x2="380" y2="44" stroke="#252529"/>

    <text x="40" y="70" fill="#EFEFEF" font-size="13" font-weight="600">Which sort is stable?</text>

    <g font-size="12" class="mono">
      <g class="quiz-opt">
        <rect x="40" y="86" width="300" height="26" rx="6" fill="#16161A" stroke="#3DA66F" stroke-width="1.3"/>
        <text x="52" y="103" fill="#EFEFEF">Merge Sort</text>
        <g class="check-pop" transform="translate(320,99)">
          <circle r="7" fill="#3DA66F"/>
          <path d="M -3 0 L -1 2.4 L 3.2 -2.6" stroke="#0B0B0F" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
      </g>
      <rect x="40" y="120" width="300" height="26" rx="6" fill="#16161A" stroke="#252529"/>
      <text x="52" y="137" fill="#8A8A8E">Quick Sort</text>
      <rect x="40" y="154" width="300" height="26" rx="6" fill="#16161A" stroke="#252529"/>
      <text x="52" y="171" fill="#8A8A8E">Heap Sort</text>
    </g>

    <!-- score/progress footer -->
    <rect x="20" y="210" width="360" height="34" rx="8" fill="#131316" stroke="#252529"/>
    <text x="36" y="231" fill="#8A8A8E" font-size="11" class="mono">Score sync</text>
    <rect x="120" y="221" width="220" height="6" rx="3" fill="#252529"/>
    <rect x="120" y="221" width="220" height="6" rx="3" fill="#C4633F" class="prog-fill pf2"/>

    <!-- figure, leaning back slightly while weighing the answer -->
    <g class="figure f3" transform="translate(200,300) rotate(-2)">
      <ellipse cx="0" cy="150" rx="86" ry="14" fill="#000" opacity="0.28" filter="url(#soft2)"/>
      <path d="M -70 150 C -73 68, -48 22, 4 18 C 52 21, 74 70, 70 150 Z" fill="#1D1D22" stroke="#2B2B31" stroke-width="1.5"/>
      <!-- thin strap collar accent -->
      <path d="M -16 22 L 16 22" fill="none" stroke="#8A8A8E" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M -16 22 L -20 40 M 16 22 L 20 40" fill="none" stroke="#8A8A8E" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
      <g class="head-tilt t2">
        <rect x="-11" y="-8" width="22" height="20" rx="8" fill="#28282E"/>
        <circle cx="0" cy="-30" r="30" fill="#242429" stroke="#2E2E34" stroke-width="1.5"/>
        <!-- short, textured hair -->
        <path d="M -29 -32 C -31 -52, -13 -59, 1 -58 C 16 -57, 30 -49, 28 -31 C 25 -42, 16 -46, 2 -46 C -12 -46, -24 -42, -29 -32 Z" fill="#191A1D"/>
        <path d="M -18 -44 L -18 -38 M -6 -46 L -6 -40 M 6 -46 L 6 -40 M 18 -44 L 18 -38" stroke="#242429" stroke-width="1.3" stroke-linecap="round"/>
      </g>
      <path d="M -55 90 C -20 106, 10 108, 42 96" fill="none" stroke="#242429" stroke-width="20" stroke-linecap="round"/>
    </g>
  </g>

  <!-- floating particles -->
  <circle class="particle p1" cx="260" cy="150" r="2" fill="#C4633F"/>
  <circle class="particle p2" cx="800" cy="110" r="1.6" fill="#EFEFEF" opacity="0.4"/>
  <circle class="particle p3" cx="1330" cy="170" r="2" fill="#3DA66F"/>
  <circle class="particle p4" cx="1000" cy="620" r="1.6" fill="#C4633F"/>

  </g><!-- /scene wrapper -->
</svg>
</div>
</body>
</html>
